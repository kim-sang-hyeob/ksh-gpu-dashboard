<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSH GPU Control</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#222b38;--muted:#8793a5;--text:#ecf2f8;--green:#41d19a;--red:#ff6b6b;--blue:#62a8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#173049 0,transparent 33%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1440px;margin:auto;padding:32px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.title{font-size:30px;font-weight:750;letter-spacing:-.03em;margin:4px 0}.sub{color:var(--muted)}.live{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.workspace,.runs{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px}.stat{padding:17px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin-top:4px;letter-spacing:-.02em}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-title h2{font-size:16px;margin:0}.section-title span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.workspace{padding:18px}.whead{display:flex;justify-content:space-between;gap:12px}.wname{font-size:18px;font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:2px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#18211f;color:var(--green);height:max-content}.badge.offline{background:#27191b;color:var(--red)}
.timeleft{color:#ffc66d;font-size:12px;margin-top:5px}.gpu-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.gpu{background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:10px}.gpu-top{display:flex;justify-content:space-between;font-size:11px}.gpu-top span{color:var(--muted)}.bar{height:5px;background:#222a34;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:inherit}.gpu small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.disk{display:flex;gap:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}.disk b{color:var(--text);font-weight:600}
.runs{overflow:hidden}.run{display:grid;grid-template-columns:1.6fr .65fr .65fr .42fr .55fr .75fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.run.head{border:0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.run-main{min-width:0}.run-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.run-purpose{margin-top:3px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.run-arch{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:11px}.status.running{color:var(--green)}.status.failed{color:var(--red)}.status.completed{color:#8fd7bd}.empty{padding:38px;text-align:center;color:var(--muted)}.error{color:var(--red)}
@media(max-width:900px){main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.gpu-list{grid-template-columns:repeat(2,1fr)}.run{grid-template-columns:1fr 1fr}.run>*:nth-child(n+3){display:none}}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">KAIST GLOW LAB</div><h1 class="title">KSH GPU Control</h1><div class="sub">여러 workspace의 GPU와 실험을 한 화면에서 확인합니다.</div></div><div class="live"><i class="dot"></i><span id="updated">불러오는 중</span></div></div>
<section class="stats"><div class="stat"><span>온라인 workspace</span><strong id="ws-count">—</strong></div><div class="stat"><span>사용 중 GPU</span><strong id="gpu-busy">—</strong></div><div class="stat"><span>전체 VRAM 사용</span><strong id="vram">—</strong></div><div class="stat"><span>진행 중 실험</span><strong id="run-count">—</strong></div></section>
<div class="section-title"><h2>Workspace</h2><span>90초 이상 응답이 없으면 오프라인</span></div><section id="workspaces" class="grid"><div class="workspace empty">첫 heartbeat를 기다리고 있습니다.</div></section>
<div class="section-title"><h2>최근 실험</h2><span id="run-summary">서버의 실행 기록 기준</span></div><section class="runs"><div class="run head"><span>실험 / 목표</span><span>프로젝트</span><span>서버</span><span>GPU</span><span>상태</span><span>마지막 갱신</span></div><div id="runs"><div class="empty">등록된 실험이 없습니다.</div></div></section>
</main><script>
const $=id=>document.getElementById(id),fmtBytes=n=>n?((n/1024/1024/1024).toFixed(1)+' GiB'):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function utc(iso){return new Date(iso.includes('T')?iso:iso.replace(' ','T')+'Z')}
function age(iso){const s=Math.max(0,Math.floor((Date.now()-utc(iso).getTime())/1000));return s<60?s+'초 전':s<3600?Math.floor(s/60)+'분 전':Math.floor(s/3600)+'시간 전'}
function remaining(iso){if(!iso)return '';const s=Math.max(0,Math.floor((utc(iso).getTime()-Date.now())/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return s<=0?'종료 시각 지남':(d?d+'일 ':'')+h+'시간 '+m+'분'}
function render(d){const now=Date.now(),online=d.workspaces.filter(w=>now-utc(w.last_seen).getTime()<90000);const allGpu=d.workspaces.flatMap(w=>w.gpus);const busy=allGpu.filter(g=>g.utilization>=10||g.memory_used_mib>=1024);const used=allGpu.reduce((a,g)=>a+g.memory_used_mib,0),total=allGpu.reduce((a,g)=>a+g.memory_total_mib,0);const runs=d.runs.map(r=>{let summary={};try{summary=JSON.parse(r.summary_json||'{}')}catch{}let gpu=[];try{gpu=JSON.parse(r.gpu_ids||'[]')}catch{}return {...r,summary,gpu}});
$('ws-count').textContent=online.length+' / '+d.workspaces.length;$('gpu-busy').textContent=busy.length+' / '+allGpu.length;$('vram').textContent=total?(used/1024).toFixed(1)+' / '+(total/1024).toFixed(0)+' GiB':'—';$('run-count').textContent=runs.filter(r=>r.status==='running').length;$('run-summary').textContent=`전체 ${runs.length} · 완료 ${runs.filter(r=>r.status==='completed').length} · 실패 ${runs.filter(r=>r.status==='failed').length}`;$('updated').textContent='방금 갱신';
$('workspaces').innerHTML=d.workspaces.length?d.workspaces.map(w=>{const on=now-utc(w.last_seen).getTime()<90000;return `<article class="workspace"><div class="whead"><div><div class="wname">${esc(w.name)}</div><div class="meta">${esc(w.cluster_name||'—')} · node ${esc(w.node||'—')} · ${age(w.last_seen)}</div>${w.expires_at?`<div class="timeleft">남은 실행 시간 ${remaining(w.expires_at)} · ${utc(w.expires_at).toLocaleString('ko-KR')} 종료</div>`:''}</div><span class="badge ${on?'':'offline'}">${on?'ONLINE':'OFFLINE'}</span></div><div class="gpu-list">${w.gpus.map(g=>`<div class="gpu"><div class="gpu-top"><b>GPU ${g.gpu_index}</b><span>${Math.round(g.utilization)}%</span></div><div class="bar"><i style="width:${Math.min(100,g.utilization)}%"></i></div><small>${Math.round(g.memory_used_mib)} / ${Math.round(g.memory_total_mib)} MiB</small><small>${g.temperature_c??'—'}°C · ${g.power_w??'—'} W</small></div>`).join('')}</div><div class="disk"><span>/root <b>${fmtBytes(w.root_used_bytes)} / ${fmtBytes(w.root_total_bytes)}</b></span><span>/scratch <b>${fmtBytes(w.scratch_used_bytes)} / ${fmtBytes(w.scratch_total_bytes)}</b></span></div></article>`}).join(''):'<div class="workspace empty">첫 heartbeat를 기다리고 있습니다.</div>';
$('runs').innerHTML=runs.length?runs.map(r=>`<div class="run"><div class="run-main"><div class="run-id">${esc(r.run_id)}</div><div class="run-purpose">${esc(r.purpose||'—')}</div>${r.summary.architecture?`<div class="run-arch">${esc(r.summary.architecture)}${r.summary.dataset?' · '+esc(r.summary.dataset):''}</div>`:''}</div><span>${esc(r.project)}</span><span>${esc(r.workspace_id)}</span><span>${esc(r.gpu.length?r.gpu.join(','):'CPU')}</span><span class="status ${esc(r.status)}">${esc(r.status)}</span><span>${age(r.updated_at)}</span></div>`).join(''):'<div class="empty">등록된 실험이 없습니다.</div>'}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());render(await r.json())}catch(e){$('updated').innerHTML='<span class="error">갱신 실패</span>';console.error(e)}}refresh();setInterval(refresh,15000);
</script></body></html>
