name: VESSL workspace auto-start

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read status only; do not start workspaces
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vessl-workspace-autostart
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.event.repository.private == false &&
      (vars.AUTO_START_ENABLED == 'true' || inputs.dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the pinned VESSL CLI
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r automation/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Check state and start stopped workspaces
        env:
          VESSL_ACCESS_TOKEN: ${{ secrets.VESSL_ACCESS_TOKEN }}
          VESSL_DEFAULT_ORGANIZATION: ${{ vars.VESSL_DEFAULT_ORGANIZATION }}
          VESSL_WORKSPACE_IDS: ${{ vars.VESSL_WORKSPACE_IDS }}
          VESSL_SAVE_CONFIG: "false"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python automation/vessl_autostart.py --dry-run
          else
            python automation/vessl_autostart.py
          fi
      - name: Keep scheduled workflows active monthly
        if: ${{ inputs.dry_run != true }}
        run: |
          month="$(date -u +%Y-%m)"
          current="$(cat .monitor/keepalive 2>/dev/null || true)"
          if [ "$current" != "$month" ]; then
            mkdir -p .monitor
            printf '%s\n' "$month" > .monitor/keepalive
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .monitor/keepalive
            git commit -m "Keep VESSL monitor active for $month"
            git push
          fi
